name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/crates/*/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/crates/*/Cargo.toml') }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::map_unwrap_or -D clippy::get_unwrap -D clippy::if_then_some_else_none -D clippy::derive_partial_eq_without_eq -D clippy::unnecessary_literal_unwrap -D clippy::todo -D clippy::dbg_macro -D clippy::fn_params_excessive_bools -D clippy::implicit_clone -D clippy::cast_lossless -D clippy::unnecessary_cast -D clippy::collapsible_str_replace -D clippy::uninlined_format_args -D clippy::redundant_closure_for_method_calls -D clippy::manual_string_new -D clippy::must_use_candidate -D clippy::default_trait_access -D clippy::float_cmp -D clippy::items_after_statements -D clippy::unnested_or_patterns -D clippy::manual_let_else -D clippy::similar_names -D clippy::unnecessary_wraps -D clippy::single_match_else -D clippy::match_same_arms

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/crates/*/Cargo.toml') }}

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked

      - name: Run all tests with nextest
        run: cargo nextest run --workspace --all-targets
