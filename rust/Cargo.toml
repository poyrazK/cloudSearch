[workspace]
members = [
    "crates/cloudsearch-api",
    "crates/cloudsearch-common",
    "crates/cloudsearch-index",
    "crates/cloudsearch-node",
    "crates/cloudsearch-storage",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
regex = "1"
rayon = "1.5"
criterion = "0.5"
