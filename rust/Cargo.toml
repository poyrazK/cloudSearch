[workspace]
members = [
    "crates/cloudsearch-api",
    "crates/cloudsearch-common",
    "crates/cloudsearch-index",
    "crates/cloudsearch-node",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v4"] }
